<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Marquee Promo Tile - 1400x560</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1400px;
      height: 560px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 100px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      overflow: hidden;
    }
    .content {
      max-width: 600px;
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: white;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .logo svg {
      width: 40px;
      height: 40px;
      fill: #667eea;
    }
    .brand {
      font-size: 36px;
      font-weight: 700;
    }
    h1 {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    p {
      font-size: 22px;
      opacity: 0.9;
      line-height: 1.5;
    }
    .mockup {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 500px;
    }
    .mockup-header {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27ca40; }
    .mockup-content {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 14px;
      color: #abb2bf;
      line-height: 1.6;
    }
    .mockup-content .heading { color: #61afef; }
    .mockup-content .text { color: #98c379; }
    .mockup-content .code { color: #e5c07b; background: #2c313a; padding: 2px 6px; border-radius: 4px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      color: #24292f;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .btn svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="logo-row">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm0 2h7v5h5v11H6V4zm9 .5L18.5 8H15V4.5zM8 12v2h8v-2H8zm0 4v2h5v-2H8z"/>
        </svg>
      </div>
      <span class="brand">printmd</span>
    </div>
    <h1>GitHub Markdown<br/>to PDF in one click</h1>
    <p>Style and export any markdown file<br/>directly from GitHub</p>
  </div>
  <div class="mockup">
    <div class="mockup-header">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="mockup-content">
      <div><span class="heading"># README.md</span></div>
      <div style="height: 12px"></div>
      <div><span class="text">Welcome to **printmd**</span></div>
      <div style="height: 8px"></div>
      <div><span class="text">The easiest way to convert</span></div>
      <div><span class="text">markdown to beautiful PDFs.</span></div>
      <div style="height: 12px"></div>
      <div><span class="code">`npm install printmd`</span></div>
    </div>
    <div class="btn">
      <svg viewBox="0 0 16 16" fill="currentColor">
        <path d="M4 1.75C4 .784 4.784 0 5.75 0h5.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 14.25 16h-8.5A1.75 1.75 0 0 1 4 14.25V1.75z"/>
      </svg>
      Open in printmd
    </div>
  </div>
</body>
</html>
