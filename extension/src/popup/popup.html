<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>printmd</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
          <path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm0 2h7v5h5v11H6V4zm9 .5L18.5 8H15V4.5zM8 12v2h8v-2H8zm0 4v2h5v-2H8z"/>
        </svg>
        <span>printmd</span>
      </div>
    </header>

    <main class="content">
      <div id="page-info" class="page-info">
        <p class="detecting">Detecting markdown...</p>
      </div>

      <div id="action-section" class="action-section hidden">
        <button id="open-button" class="primary-button">
          Open in printmd
        </button>
      </div>

      <div id="no-markdown" class="no-markdown hidden">
        <p>No markdown file detected on this page.</p>
        <p class="hint">Visit a GitHub markdown file or README to use printmd.</p>
      </div>

      <div class="divider"></div>

      <div class="recent-section">
        <h3>Recent Files</h3>
        <ul id="recent-list" class="recent-list">
          <li class="empty">No recent files</li>
        </ul>
      </div>
    </main>

    <footer class="footer">
      <a href="https://printmd.app" target="_blank" rel="noopener">Open printmd.app</a>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
