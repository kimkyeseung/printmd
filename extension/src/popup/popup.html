<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>printmd</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
          <path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm0 2h7v5h5v11H6V4zm9 .5L18.5 8H15V4.5zM8 12v2h8v-2H8zm0 4v2h5v-2H8z"/>
        </svg>
        <span>printmd</span>
      </div>
    </header>

    <main class="content">
      <div id="page-info" class="page-info">
        <p class="detecting" data-i18n="popupDetecting"></p>
      </div>

      <div id="action-section" class="action-section hidden">
        <button id="open-button" class="primary-button" data-i18n="popupOpenButton"></button>
      </div>

      <div id="no-markdown" class="no-markdown hidden">
        <p data-i18n="popupNoMarkdown"></p>
        <p class="hint" data-i18n="popupNoMarkdownHint"></p>
      </div>

      <div class="divider"></div>

      <div class="recent-section">
        <div class="recent-header">
          <h3 data-i18n="popupRecentFiles"></h3>
          <button id="clear-recent" class="clear-btn hidden" data-i18n="popupClearAll"></button>
        </div>
        <ul id="recent-list" class="recent-list">
          <li class="empty" data-i18n="popupNoRecentFiles"></li>
        </ul>
      </div>
    </main>

    <footer class="footer">
      <a href="https://printmd.app" target="_blank" rel="noopener" data-i18n="popupOpenPrintmd"></a>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
